name: Tester

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "app/lib/metrics.js"
      - "app/universitet/OrakletsForskningslabbVy.js"
      - "tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "**.py"
      - "app/lib/metrics.js"
      - "app/universitet/OrakletsForskningslabbVy.js"
      - "tests/**"
      - ".github/workflows/tests.yml"

jobs:
  python-tester:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installera beroenden
        run: pip install pytest httpx
      - name: Kör nyckeltalstester
        run: python -m pytest tests/ -v

  js-tester:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Installera JavaScript-beroenden
        run: npm install --ignore-scripts
      - name: Kör JavaScript-tester
        run: node --test tests/*.test.mjs
