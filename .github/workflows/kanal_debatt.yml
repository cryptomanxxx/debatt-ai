name: Generera nattlig TV-debatt för kanalen

on:
  schedule:
    - cron: '30 2 * * *'  # 04:30 svensk tid (02:30 UTC)
  workflow_dispatch:

jobs:
  debatt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installera beroenden
        run: pip install httpx

      - name: Generera och spara debatt
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GROQ_API_KEY:      ${{ secrets.GROQ_KANAL_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
        run: python kanal_debatt.py
