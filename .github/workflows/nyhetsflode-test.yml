name: Nyhetsflöde

on:
  schedule:
    # 6 körningar/dag — RSS-flöden visar bara sina ~10 senaste poster, så
    # tätare körningar fångar fler artiklar innan de rullar ur fönstret
    # (jfr en enda körning/dag som skulle missa mycket av dygnets volym).
    - cron: "0 2 * * *"   # 04:00 svensk tid
    - cron: "0 6 * * *"   # 08:00 svensk tid
    - cron: "0 10 * * *"  # 12:00 svensk tid
    - cron: "0 14 * * *"  # 16:00 svensk tid
    - cron: "0 18 * * *"  # 20:00 svensk tid
    - cron: "0 22 * * *"  # 00:00 svensk tid
  workflow_dispatch:

jobs:
  nyhetsflode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installera beroenden
        run: pip install httpx

      - name: Kör nyhetsflode_test.py
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YOUTUBE_PROXY_SECRET: ${{ secrets.YOUTUBE_PROXY_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: python -u nyhetsflode_test.py
