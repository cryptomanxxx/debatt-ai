name: Filmrecensenten

on:
  schedule:
    - cron: '0 6,10,14,18 * * *'  # 08/12/16/20 svensk tid (sommartid) — kollar kanalens senaste video 4x/dag
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recension:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installera beroenden
        run: pip install httpx

      - name: Kör Filmrecensenten
        env:
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2:    ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3:    ${{ secrets.GROQ_API_KEY_3 }}
          DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEBATT_API_KEY:    ${{ secrets.DEBATT_API_KEY }}
          # Krävs för att bläddra kanalens HELA uppladdningskatalog
          # (~9000+ videor) istället för bara den senaste videon — se
          # filmrecensent.py. Saknas secreten faller skriptet tillbaka på
          # det gamla RSS-baserade "bara senaste videon"-beteendet.
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 filmrecensent.py
