name: Filmrecensenten

on:
  schedule:
    # EN trigger istället för 4 separata (se ✅128 i CLAUDE.md) — "Kör
    # Filmrecensenten"-steget nedan loopar 4 pass internt i samma körning.
    # filmrecensent.py:s cursor/pending-state (filmrecensent_state-tabellen)
    # är redan tidpunktsagnostisk och säkert återanropningsbar i en tät
    # sekventiell loop — den fortsätter alltid där föregående pass sparade
    # cursorn.
    - cron: '0 6 * * *'  # 08:00 svensk tid (sommartid) — 4 pass i samma körning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recension:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installera beroenden
        run: pip install httpx

      - name: Kör Filmrecensenten
        env:
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2:    ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3:    ${{ secrets.GROQ_API_KEY_3 }}
          DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEBATT_API_KEY:    ${{ secrets.DEBATT_API_KEY }}
          # Krävs för att bläddra kanalens HELA uppladdningskatalog
          # (~9000+ videor) istället för bara den senaste videon — se
          # filmrecensent.py. Saknas secreten faller skriptet tillbaka på
          # det gamla RSS-baserade "bara senaste videon"-beteendet.
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set +e
          FAILED=0
          for i in $(seq 1 4); do
            echo "=== Filmrecension $i/4 ==="
            python3 filmrecensent.py
            ec=$?
            if [ $ec -ne 0 ]; then
              echo "::warning::Pass $i/4 misslyckades (exit $ec) — fortsätter med nästa pass."
              FAILED=1
            fi
            if [ "$i" -lt 4 ]; then
              sleep 60
            fi
          done
          exit $FAILED
