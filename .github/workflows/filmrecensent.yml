name: Filmrecensenten

on:
  schedule:
    # EN trigger istället för 4 separata (se ✅128 i CLAUDE.md) — "Kör
    # Filmrecensenten"-steget nedan loopar 4 pass internt i samma körning.
    # filmrecensent.py:s cursor/pending-state (filmrecensent_state-tabellen)
    # är redan tidpunktsagnostisk och säkert återanropningsbar i en tät
    # sekventiell loop — den fortsätter alltid där föregående pass sparade
    # cursorn.
    - cron: '0 10 * * *'  # 12:00 svensk tid (sommartid, ✅129) — primär körning, 4 pass
    # Tre sena catch-up-körningar ger Filmrecensenten samma redundans som
    # agent.yml. filmrecensent.py kontrollerar MALSATT_ANTAL_PER_DAG=4 före
    # varje pass, så när dagens fyra redan finns blir dessa billiga no-ops.
    # Om primärkörningen däremot försenats/misslyckats toppar de upp till 4.
    - cron: '30 21 * * *'  # 23:30 svensk sommartid — catch-up 1/3
    - cron: '40 21 * * *'  # 23:40 svensk sommartid — catch-up 2/3
    - cron: '50 21 * * *'  # 23:50 svensk sommartid — catch-up 3/3
  workflow_dispatch:      # Manuellt, eller automatisk ombudspublicering från
    # invariant-checker.js (✅131) när dagens filmrecension fortfarande
    # ligger på 0 långt efter det schemalagda fönstret.

# Serialiserar körningar istället för att låta dem köra parallellt — samma
# mönster och motivering som agent.yml:s debatt-agent-publish-grupp. Utan
# detta kunde en ombudsdispatch starta SAMTIDIGT som en bara försenad
# (inte faktiskt misslyckad) ordinarie körning, vilket gör
# filmrecensent.py:s dagliga kvotkontroll (hamta_publicerade_idag(),
# se ✅132) opålitlig — båda processerna kunde då läsa samma
# "0 publicerade idag"-läge innan någon hunnit publicera och tillsammans
# ändå producera fler recensioner än dagens mål. queue: max krävs utöver
# cancel-in-progress: false — annars behåller GitHub bara en enda väntande
# körning per grupp och tappar tyst en tredje trigger (Codex-fynd, PR #1515-
# granskning).
concurrency:
  group: filmrecensent-publish
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  recension:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installera beroenden
        run: pip install httpx

      - name: Kör Filmrecensenten
        env:
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2:    ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3:    ${{ secrets.GROQ_API_KEY_3 }}
          DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEBATT_API_KEY:    ${{ secrets.DEBATT_API_KEY }}
          # Krävs för att bläddra kanalens HELA uppladdningskatalog
          # (~9000+ videor) istället för bara de senaste videorna — se
          # filmrecensent.py. Saknas secreten faller skriptet tillbaka på
          # det gamla RSS-baserade beteendet (skannar de ~15 senast
          # uppladdade videorna i flödet, hoppar över redan recenserade —
          # se hamta_senaste_video(), Codex-fynd PR #1501-granskning: annars
          # hade bara pass 1 av dagens 4 gjort något, resten sett samma
          # (redan recenserade) video och no-opat).
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          # OBS: pending_forsok/MAX_PENDING_FORSOK-retryn (filmrecensent.py)
          # räknas EN gång per KÖRNING (dag), inte en gång per pass nedan —
          # se AKTUELL_KORNING_ID/pending_run_id (Codex-fynd, PR #1501-
          # granskning). En kort transient leverantörsstörning under dessa
          # 4 pass kan därför aldrig ensam förbruka hela retry-budgeten.
          set +e
          FAILED=0
          for i in $(seq 1 4); do
            echo "=== Filmrecension $i/4 ==="
            python3 filmrecensent.py
            ec=$?
            if [ $ec -ne 0 ]; then
              echo "::warning::Pass $i/4 misslyckades (exit $ec) — fortsätter med nästa pass."
              FAILED=1
            fi
            if [ "$i" -lt 4 ]; then
              sleep 60
            fi
          done
          exit $FAILED
