name: Civilisationshistorikern

on:
  schedule:
    - cron: '0 18 * * 0'  # Söndagar 18:00 UTC = 20:00 svensk tid
  workflow_dispatch:

permissions:
  contents: write

jobs:
  krönika:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kör Civilisationshistorikern
        env:
          CEREBRAS_API_KEY:  ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DEBATT_API_KEY:    ${{ secrets.DEBATT_API_KEY }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
        run: node agents/civilisations-historiker.js

      - name: Committa krönika om ny fil skapades
        run: |
          git config user.name  "civilisationshistorikern-bot"
          git config user.email "bot@debatt-ai.se"
          if git diff --quiet && ! git status --porcelain | grep -q "^??.*ai-bus/discussions/"; then
            echo "Ingen ny fil — inget att committa."
            exit 0
          fi
          git add ai-bus/discussions/
          if git diff --cached --quiet; then
            echo "Inget att committa."
            exit 0
          fi
          git commit -m "chron: Civilisationshistorikern $(date +%Y-%m-%d)"
          git push origin HEAD
          echo "Krönika committad och pushad."
