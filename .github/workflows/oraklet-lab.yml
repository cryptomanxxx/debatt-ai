name: Oraklets forskningslabb

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Reproducerbar testdata: 1–9 siffror'
        required: true
        default: '20261006'

permissions:
  contents: read

concurrency:
  group: oraklet-lab
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Kör metodtest och spara rapport
        env:
          EXPERIMENT_SEED: ${{ inputs.seed }}
          ORCHESTRATOR_API_KEY: ${{ secrets.ORCHESTRATOR_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node agents/oraklet-lab.mjs
      - name: Spara reproducerbar rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oraklet-metodtest-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/oraklet-lab/
          if-no-files-found: ignore
