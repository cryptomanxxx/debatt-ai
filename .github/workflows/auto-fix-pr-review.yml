name: Auto-fix PR-reviewkommentarer

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Kontrollera om review ska hanteras
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REVIEWER="${{ github.event.review.user.login }}"
          STATE="${{ github.event.review.state }}"
          PR_NUM="${{ github.event.pull_request.number }}"

          # Kontrollera om PR är mergad via gh (mer tillförlitligt än event-payload)
          PR_STATE=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json state -q '.state' 2>/dev/null || echo "UNKNOWN")
          echo "PR #$PR_NUM state: $PR_STATE, Reviewer: $REVIEWER, State: $STATE"

          if [[ "$PR_STATE" == "MERGED" || "$PR_STATE" == "CLOSED" ]]; then
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "Skippar — PR är redan $PR_STATE"
            exit 0
          fi

          # Skippa om det är auto-fix-boten själv (undvik loopar)
          if [[ "$REVIEWER" == "auto-fix-bot" ]] || [[ "$REVIEWER" == *"github-actions"* ]]; then
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "Skippar — review från bot som kan orsaka loop"
            exit 0
          fi

          # Explicit deny-lista — externa AI-reviewers aldrig auto-fixas oavsett state
          for denied in codex gemini; do
            if [[ "$REVIEWER" == *"$denied"* ]]; then
              echo "SKIP=true" >> "$GITHUB_ENV"
              echo "Skippar — $REVIEWER är i deny-listan för externa AI-reviewers"
              exit 0
            fi
          done

          # Kör om: känd intern code review-bot ELLER changes_requested från människa
          IS_BOT=false
          for pattern in copilot coderabbit codestral; do
            if [[ "$REVIEWER" == *"$pattern"* ]]; then
              IS_BOT=true
              break
            fi
          done

          if [[ "$IS_BOT" == "true" ]] || [[ "$STATE" == "changes_requested" ]]; then
            echo "SKIP=false" >> "$GITHUB_ENV"
            echo "Hanterar review från $REVIEWER (state: $STATE)"
          else
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "Skippar — inte en bot-review och inte changes_requested"
          fi

      - name: Checkout PR-branch
        if: env.SKIP == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Samla reviewdata
        if: env.SKIP == 'false'
        env:
          REVIEW_BODY: ${{ github.event.review.body }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          REVIEWER="${{ github.event.review.user.login }}"
          BRANCH="${{ github.event.pull_request.head.ref }}"

          echo "PR #$PR_NUM — review av $REVIEWER på branch $BRANCH"

          echo "REVIEWER=$REVIEWER" >> "$GITHUB_ENV"
          echo "PR_NUM=$PR_NUM"     >> "$GITHUB_ENV"
          echo "BRANCH=$BRANCH"     >> "$GITHUB_ENV"
          printf '%s' "$REVIEW_BODY" > /tmp/review_body.txt

      - name: Kontrollera deduplicering
        if: env.SKIP == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list \
            --state open \
            --label "auto-fix" \
            --search "Review-fix PR #${{ env.PR_NUM }}" \
            --json number -q '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "Öppen review-fix PR #$EXISTING finns redan — hoppar över"
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Kör autofix-review med Groq
        if: env.SKIP == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GROQ_API_KEY_7: ${{ secrets.GROQ_API_KEY_7 }}
          GROQ_API_KEY_8: ${{ secrets.GROQ_API_KEY_8 }}
          GROQ_API_KEY_9: ${{ secrets.GROQ_API_KEY_9 }}
          GROQ_API_KEY_10: ${{ secrets.GROQ_API_KEY_10 }}
          PR_NUM: ${{ env.PR_NUM }}
          REVIEWER: ${{ env.REVIEWER }}
          BRANCH: ${{ env.BRANCH }}
        run: |
          # Säkerhet: hämta alltid skriptet från main, aldrig från PR-branchen
          git fetch origin main
          git checkout FETCH_HEAD -- agents/autofix-review.js
          node agents/autofix-review.js 2>&1 | tee /tmp/autofix_run.txt

      - name: Committa och pusha fixes
        if: env.SKIP == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "auto-fix-bot"
          git config user.email "bot@debatt-ai.se"

          git add -A
          # GITHUB_TOKEN saknar 'workflows'-rättighet — exkludera workflow-filer
          git reset HEAD .github/workflows/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Inga ändringar gjordes"
            echo "FIXED=false" >> "$GITHUB_ENV"
          else
            git commit -m "fix(review): adresserar reviewkommentarer från $REVIEWER på PR $PR_NUM"
            git pull --rebase origin "$BRANCH"
            git push origin "$BRANCH"
            echo "FIXED=true" >> "$GITHUB_ENV"
          fi

      - name: Posta statuskomentar på PR
        if: env.SKIP == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT=$(head -40 /tmp/autofix_output.txt 2>/dev/null || echo "(ingen output)")
          if [[ "$FIXED" == "true" ]]; then
            {
              echo "✅ **Auto-fix** (Groq) har adresserat reviewkommentarerna från @${REVIEWER} och pushade fixes till \`${BRANCH}\`."
              echo ""
              echo "### Vad som fixades"
              echo '```'
              echo "$OUTPUT"
              echo '```'
              echo ""
              echo "*Kontrollera gärna ändringarna innan merge.*"
            } > /tmp/pr_comment.txt
          else
            {
              echo "🔍 **Auto-fix** (Groq) analyserade reviewkommentarerna från @${REVIEWER} — inga kodändringar behövdes."
              echo ""
              echo '```'
              echo "$OUTPUT"
              echo '```'
            } > /tmp/pr_comment.txt
          fi
          gh pr comment "$PR_NUM" --body-file /tmp/pr_comment.txt

      - name: Sätt label auto-fix på PR
        if: env.SKIP == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "auto-fix" \
            --color "e11d48" \
            --description "Automatisk fix genererad av GitHub Models" \
            2>/dev/null || true
          gh pr edit "$PR_NUM" --add-label "auto-fix" 2>/dev/null || true
