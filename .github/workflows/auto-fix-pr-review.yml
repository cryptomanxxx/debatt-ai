name: Auto-fix PR-reviewkommentarer

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Kontrollera om review ska hanteras
        id: guard
        run: |
          REVIEWER="${{ github.event.review.user.login }}"
          STATE="${{ github.event.review.state }}"
          MERGED="${{ github.event.pull_request.merged }}"
          echo "Reviewer: $REVIEWER, State: $STATE, Merged: $MERGED"

          # Skippa om PR redan är mergad — review är på gammal kod
          if [[ "$MERGED" == "true" ]]; then
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "Skippar — PR är redan mergad"
            exit 0
          fi

          # Skippa om det är auto-fix-boten själv (undvik loopar)
          if [[ "$REVIEWER" == "auto-fix-bot" ]] || [[ "$REVIEWER" == *"github-actions"* ]]; then
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "Skippar — review från bot som kan orsaka loop"
            exit 0
          fi

          # Kör om: känd code review-bot ELLER changes_requested
          IS_BOT=false
          for pattern in copilot codex coderabbit codestral gemini; do
            if [[ "$REVIEWER" == *"$pattern"* ]]; then
              IS_BOT=true
              break
            fi
          done

          if [[ "$IS_BOT" == "true" ]] || [[ "$STATE" == "changes_requested" ]]; then
            echo "SKIP=false" >> "$GITHUB_ENV"
            echo "Hanterar review från $REVIEWER (state: $STATE)"
          else
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "Skippar — inte en bot-review och inte changes_requested"
          fi

      - name: Checkout PR-branch
        if: env.SKIP == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Samla reviewkommentarer
        if: env.SKIP == 'false'
        id: comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_BODY: ${{ github.event.review.body }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          REVIEWER="${{ github.event.review.user.login }}"
          BRANCH="${{ github.event.pull_request.head.ref }}"

          echo "PR #$PR_NUM — review av $REVIEWER på branch $BRANCH"

          # Hämta alla inline-kommentarer på PR:n
          gh api "repos/${{ github.repository }}/pulls/${PR_NUM}/comments" \
            --jq '.[] | "FIL: \(.path) RAD: \(.line // .original_line // "?")\nKOMMENTAR: \(.body)\n---"' \
            > /tmp/inline_comments.txt 2>/dev/null || echo "(inga inline-kommentarer)" > /tmp/inline_comments.txt

          # Hämta PR-diff (max 300 rader)
          gh api "repos/${{ github.repository }}/pulls/${PR_NUM}" \
            --header "Accept: application/vnd.github.v3.diff" \
            2>/dev/null | head -300 > /tmp/pr_diff.txt || echo "(diff ej tillgängligt)" > /tmp/pr_diff.txt

          echo "REVIEWER=$REVIEWER"         >> "$GITHUB_ENV"
          echo "PR_NUM=$PR_NUM"             >> "$GITHUB_ENV"
          echo "BRANCH=$BRANCH"             >> "$GITHUB_ENV"
          printf '%s' "$REVIEW_BODY"        > /tmp/review_body.txt
          echo "Kommentarer insamlade"

      - name: Kontrollera deduplicering
        if: env.SKIP == 'false'
        id: dedupe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list \
            --state open \
            --label "auto-fix" \
            --search "Review-fix PR #${{ env.PR_NUM }}" \
            --json number -q '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "Öppen review-fix PR #$EXISTING finns redan — hoppar över"
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            echo "SKIP=false" >> "$GITHUB_ENV"
          fi

      - name: Installera Claude Code CLI
        if: env.SKIP == 'false'
        run: |
          npm install -g @anthropic-ai/claude-code@latest 2>/dev/null || \
          npm install -g @anthropic-ai/claude-code 2>/dev/null || true
          claude --version 2>/dev/null && echo "CLAUDE_INSTALLED=true" >> "$GITHUB_ENV" || \
          echo "CLAUDE_INSTALLED=false" >> "$GITHUB_ENV"

      - name: Kör Claude Code på reviewkommentarerna
        if: env.SKIP == 'false' && env.CLAUDE_INSTALLED == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Bygg promptfil — undviker YAML-parsningsproblem med flerradiga bash-strängar
          {
            echo "Du analyserar en code review på en PR i projektet Debatt-AI (Next.js + Python + Supabase)."
            echo ""
            echo "Reviewer: $REVIEWER"
            echo "PR $PR_NUM på branch: $BRANCH"
            echo ""
            echo "REVIEW-SAMMANFATTNING:"
            cat /tmp/review_body.txt
            echo ""
            echo "INLINE-KOMMENTARER (fil/rad/text):"
            cat /tmp/inline_comments.txt
            echo ""
            echo "PR-DIFF (utdrag):"
            echo '```diff'
            cat /tmp/pr_diff.txt
            echo '```'
            echo ""
            echo "Debatt-AI är en plattform med:"
            echo "- Next.js App Router frontend (app/)"
            echo "- Python-agentskript (agent.py, supabase_utils.py, m.fl.)"
            echo "- Supabase som databas"
            echo "- AI-providers: Groq, Gemini, Cerebras (med fallback-kedja)"
            echo ""
            echo "Uppgift:"
            echo "1. Läs igenom reviewkommentarerna noggrant"
            echo "2. För varje konkret, genomförbar fix (buggar, style, typos, säkerhetsproblem, logikfel): åtgärda direkt i relevant fil med Edit-verktyget"
            echo "3. Ignorera subjektiva preferenser och kommentarer om extern infrastruktur"
            echo "4. Gör ENDAST de minimala ändringarna som kommentarerna kräver — lägg inte till orelaterade förbättringar"
            echo "5. Om en kommentar är oklar eller kräver arkitektoniska beslut: hoppa över den"
            echo ""
            echo "Redigera filerna direkt. Skapa INGA nya filer om inte reviewen explicit ber om det."
          } > /tmp/claude_prompt.txt

          claude --dangerously-skip-permissions -p "$(cat /tmp/claude_prompt.txt)" 2>&1 | tee /tmp/claude_review_output.txt
          echo "Claude Code kördes på reviewkommentarerna"

      - name: Committa och pusha fixes
        if: env.SKIP == 'false' && env.CLAUDE_INSTALLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "auto-fix-bot"
          git config user.email "bot@debatt-ai.se"

          git add -A
          # GITHUB_TOKEN saknar 'workflows'-rättighet — exkludera workflow-filer
          git reset HEAD .github/workflows/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Inga ändringar gjordes (eller enbart workflow-filer)"
            echo "FIXED=false" >> "$GITHUB_ENV"
          else
            git commit -m "fix(review): adresserar reviewkommentarer från $REVIEWER på PR $PR_NUM"
            git pull --rebase origin "$BRANCH"
            git push origin "$BRANCH"
            echo "FIXED=true" >> "$GITHUB_ENV"
          fi

      - name: Posta statuskomentar på PR
        if: env.SKIP == 'false' && env.CLAUDE_INSTALLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$FIXED" == "true" ]]; then
            {
              echo "✅ **Auto-fix** har adresserat reviewkommentarerna från @${REVIEWER} och pushade fixes till \`${BRANCH}\`."
              echo ""
              echo "### Vad som fixades"
              echo '```'
              head -40 /tmp/claude_review_output.txt
              echo '```'
              echo ""
              echo "*Kontrollera gärna ändringarna innan merge.*"
            } > /tmp/pr_comment.txt
          else
            {
              echo "🔍 **Auto-fix** körde Claude Code på reviewkommentarerna från @${REVIEWER} — inga kodändringar behövdes."
              echo ""
              echo '```'
              head -20 /tmp/claude_review_output.txt
              echo '```'
            } > /tmp/pr_comment.txt
          fi
          gh pr comment "$PR_NUM" --body-file /tmp/pr_comment.txt

      - name: Sätt label auto-fix på PR
        if: env.SKIP == 'false' && env.CLAUDE_INSTALLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "auto-fix" \
            --color "e11d48" \
            --description "Automatisk fix genererad av Claude Code" \
            2>/dev/null || true
          gh pr edit "$PR_NUM" --add-label "auto-fix" 2>/dev/null || true
