name: Invariant Checker

on:
  schedule:
    - cron: "0 */3 * * *"  # var 3:e timme
  workflow_dispatch:

jobs:
  invariant-checker:
    runs-on: ubuntu-latest
    # actions:write krävs av "Trigga ombudspublicering" nedan (✅131) — den
    # avfyrar agent.yml via workflow_dispatch med GITHUB_TOKEN, vilket kräver
    # skrivrättighet på actions. contents:read räcker för checkout.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Kör invariant-checkar
        id: run
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node agents/invariant-checker.js

      # ✅131: användaren påpekade korrekt att bara DETEKTERA ett
      # publiceringsunderskott inte räcker — om GitHubs schemaläggare redan
      # missköter de tre primära crons i agent.yml (se PR #1513s ✅130-
      # utredning), finns ingen garanti att catch-up-crons (21:30–21:50 UTC,
      # samma opålitliga schemaläggare) kör i tid heller. Så fort
      # invariant-checker.js bekräftar ett underskott (behover_ombudspublicering,
      # satt EXKLUSIVT av checkPubliceringstaktUnderskott — aldrig av någon
      # annan check) triggas agent.yml direkt med 4 pass, samma täckning som
      # ett riktigt fönster. En bekräftad underskott-check rapporterar alltid
      # "fail" (main() sätter då process.exitCode=1), så failure() är den
      # exakta — inte bara tillräckliga — villkoret, samma mönster som
      # felmejl-steget nedan redan använder.
      #
      # Säkert mot dubbeltriggning: invariant-check.yml kör var 3:e timme
      # (12/15/18 UTC ligger alla inom kontrollfönstret), så flera körningar
      # kan i teorin se samma underskott och trigga flera gånger — men
      # agent.py läser dagens kvot fräscht vid varje pass och avslutar
      # omedelbart (sys.exit(0)) om allt redan är 4/4/4, så en redundant
      # ombudspublicering är en billig no-op, inte en dubbelpublicering.
      - name: Trigga ombudspublicering
        if: failure() && steps.run.outputs.behover_ombudspublicering == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run agent.yml --repo "${{ github.repository }}" --ref main -f pass=4

      # ✅108-uppföljning: GitHub:s egen felnotis vid en misslyckad
      # schemalagd körning säger bara "Run failed" — ingen antydan om VILKEN
      # check som floppade eller varför. invariant-checker.js skriver nu en
      # sammanfattning (namn + detaljmeddelande per icke-OK check) till
      # GITHUB_OUTPUT när något är fel; det här steget citerar den
      # sammanfattningen rakt av i ett eget, mer specifikt mejl. Körs bara
      # om körningen ovan faktiskt floppade OCH gav en sammanfattning att
      # skicka — en tom sammanfattning (borde aldrig hända om steget ovan
      # misslyckades) skickar inget mejl.
      - name: Skicka detaljerad felmejl
        if: failure() && steps.run.outputs.sammanfattning != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SAMMANFATTNING: ${{ steps.run.outputs.sammanfattning }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY saknas — hoppar över detaljmejlet (GitHub:s egen notis går ut som vanligt)"
            exit 0
          fi
          FAIL_COUNT=$(printf '%s\n' "$SAMMANFATTNING" | grep -c '^❌' || true)
          PAYLOAD=$(jq -n \
            --arg from "noreply@debatt-ai.se" \
            --arg to "neonhawk194@gmail.com" \
            --arg subject "🚨 Invariant Checker: ${FAIL_COUNT} check(ar) floppade" \
            --arg body "$SAMMANFATTNING" \
            --arg runurl "$RUN_URL" \
            '{
              from: $from,
              to: [$to],
              subject: $subject,
              html: ("<p>Invariant-checkaren hittade problem vid senaste körningen:</p><pre style=\"white-space:pre-wrap;font-family:monospace;background:#111;color:#eee;padding:12px;border-radius:6px\">" + ($body | @html) + "</pre><p><a href=\"" + ($runurl|@html) + "\">Se full körningslogg på GitHub →</a></p><p><a href=\"https://www.debatt-ai.se/status\">Se /status →</a></p>")
            }')
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
