name: Invariant Checker

on:
  schedule:
    - cron: "0 */3 * * *"  # var 3:e timme
  workflow_dispatch:

jobs:
  invariant-checker:
    runs-on: ubuntu-latest
    # actions:write krävs av "Trigga ombudspublicering" nedan (✅131) — den
    # avfyrar agent.yml via workflow_dispatch med GITHUB_TOKEN, vilket kräver
    # skrivrättighet på actions. contents:read räcker för checkout.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Kör invariant-checkar
        id: run
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node agents/invariant-checker.js

      # ✅131: användaren påpekade korrekt att bara DETEKTERA ett
      # publiceringsunderskott inte räcker — om GitHubs schemaläggare redan
      # missköter de primära crons i agent.yml/filmrecensent.yml (se PR
      # #1513s ✅130-utredning), finns ingen garanti att agent.yml:s egen
      # catch-up (21:30–21:50 UTC, samma opålitliga schemaläggare) kör i tid
      # heller. Så fort invariant-checker.js bekräftar ett underskott
      # (underskott_typer, satt EXKLUSIVT av checkPubliceringstaktUnderskott
      # — aldrig av någon annan check) triggas rätt workflow direkt.
      #
      # ✅132: användaren påpekade vidare att en enda generisk "pass=4"-
      # dispatch till agent.yml inte räcker för PRECISION — agent.py:s egna
      # nyhet/replik/eget-val är annars semi-slumpmässigt (myntkast/vikter,
      # se agent.py) utanför ett riktigt fönster, med ingen garanti att just
      # den saknade typen faktiskt skrivs under de 4 passen. underskott_typer
      # är en komma-separerad lista av EXAKT vilka typer som saknas
      # (nyhet/replik/eget/film) — loopen nedan dispatchar en separat, typ-
      # forcerad körning PER saknad typ istället: agent.yml med typ=X för
      # nyhet/replik/eget (kringgår helt fönster-/slumplogiken, se
      # AGENT_FORCE_TYP i agent.py), filmrecensent.yml (ingen typ-parameter
      # behövs — helt separat workflow med egen cursor-baserad logik,
      # oberoende av agent.py:s 4+4+4-kvotsystem).
      #
      # En bekräftad underskott-check rapporterar alltid "fail" (main()
      # sätter då process.exitCode=1), så failure() är den exakta — inte
      # bara tillräckliga — villkoret, samma mönster som felmejl-steget
      # nedan redan använder.
      #
      # Säkert mot dubbeltriggning: invariant-check.yml kör var 3:e timme
      # (12/15/18 UTC ligger alla inom kontrollfönstret), så flera körningar
      # kan i teorin se samma underskott och trigga flera gånger — men
      # agent.py/filmrecensent.py läser dagens läge fräscht vid varje pass
      # och avslutar/no-opar omedelbart om allt redan är i mål, så en
      # redundant ombudspublicering är en billig no-op, inte en
      # dubbelpublicering.
      - name: Trigga ombudspublicering
        if: failure() && steps.run.outputs.underskott_typer != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNDERSKOTT_TYPER: ${{ steps.run.outputs.underskott_typer }}
        run: |
          IFS=',' read -ra TYPER <<< "$UNDERSKOTT_TYPER"
          for t in "${TYPER[@]}"; do
            if [ "$t" = "film" ]; then
              echo "=== Ombudspublicering: film (filmrecensent.yml) ==="
              gh workflow run filmrecensent.yml --repo "${{ github.repository }}" --ref main
            else
              echo "=== Ombudspublicering: $t (agent.yml, typ=$t) ==="
              gh workflow run agent.yml --repo "${{ github.repository }}" --ref main -f pass=4 -f "typ=$t"
            fi
          done

      # ✅108-uppföljning: GitHub:s egen felnotis vid en misslyckad
      # schemalagd körning säger bara "Run failed" — ingen antydan om VILKEN
      # check som floppade eller varför. invariant-checker.js skriver nu en
      # sammanfattning (namn + detaljmeddelande per icke-OK check) till
      # GITHUB_OUTPUT när något är fel; det här steget citerar den
      # sammanfattningen rakt av i ett eget, mer specifikt mejl. Körs bara
      # om körningen ovan faktiskt floppade OCH gav en sammanfattning att
      # skicka — en tom sammanfattning (borde aldrig hända om steget ovan
      # misslyckades) skickar inget mejl.
      - name: Skicka detaljerad felmejl
        if: failure() && steps.run.outputs.sammanfattning != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SAMMANFATTNING: ${{ steps.run.outputs.sammanfattning }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY saknas — hoppar över detaljmejlet (GitHub:s egen notis går ut som vanligt)"
            exit 0
          fi
          FAIL_COUNT=$(printf '%s\n' "$SAMMANFATTNING" | grep -c '^❌' || true)
          PAYLOAD=$(jq -n \
            --arg from "noreply@debatt-ai.se" \
            --arg to "neonhawk194@gmail.com" \
            --arg subject "🚨 Invariant Checker: ${FAIL_COUNT} check(ar) floppade" \
            --arg body "$SAMMANFATTNING" \
            --arg runurl "$RUN_URL" \
            '{
              from: $from,
              to: [$to],
              subject: $subject,
              html: ("<p>Invariant-checkaren hittade problem vid senaste körningen:</p><pre style=\"white-space:pre-wrap;font-family:monospace;background:#111;color:#eee;padding:12px;border-radius:6px\">" + ($body | @html) + "</pre><p><a href=\"" + ($runurl|@html) + "\">Se full körningslogg på GitHub →</a></p><p><a href=\"https://www.debatt-ai.se/status\">Se /status →</a></p>")
            }')
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
