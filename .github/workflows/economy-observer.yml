name: Economy Observer

on:
  schedule:
    - cron: "0 8 * * *"  # 08:00 UTC = 10:00 svensk tid
  workflow_dispatch:

permissions:
  contents: write

jobs:
  economy-observer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kör economy-observer
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node agents/economy-observer.js

      - name: Commit economy analysis
        id: commit
        run: |
          git config user.name "Economy Observer"
          git config user.email "noreply@debatt-ai.se"
          git add ai-bus/discussions/
          if git diff --cached --quiet; then
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "economy: Daglig ekonomianalys $(date +%Y-%m-%d)"
            git push
            echo "committed=true" >> $GITHUB_OUTPUT
            echo "filename=$(git diff HEAD~1 --name-only | grep 'ai-bus' | head -1)" >> $GITHUB_OUTPUT
          fi

      - name: Skicka email-notifikation
        if: steps.commit.outputs.committed == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          DATUM=$(date +%Y-%m-%d)
          FILENAME="${{ steps.commit.outputs.filename }}"
          GITHUB_URL="https://github.com/cryptomanxxx/debatt-ai/blob/main/${FILENAME}"
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\": \"noreply@debatt-ai.se\", \"to\": [\"neonhawk194@gmail.com\"], \"subject\": \"📊 Economy Observer: Ny ekonomianalys ${DATUM}\", \"html\": \"<p>Economy Observer har publicerat en ny analys av AI-civilisationens ekonomi för <strong>${DATUM}</strong>.</p><p><a href='${GITHUB_URL}'>Läs analysen på GitHub →</a></p><p><small>debatt-ai.se ai-bus</small></p>\"}"
