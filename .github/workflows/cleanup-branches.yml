name: Ta bort branch efter merge

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Radera branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          if [ "$BRANCH" = "main" ]; then exit 0; fi
          gh api repos/${{ github.repository }}/git/refs/heads/$BRANCH -X DELETE \
            && echo "Raderade branch: $BRANCH" \
            || echo "Kunde inte radera $BRANCH (redan borttagen?)"
