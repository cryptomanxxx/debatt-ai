name: Riksdag Utfall

on:
  schedule:
    # Kör varje dag kl 06:30 UTC (08:30 svensk sommartid) — efter riksdag-import
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  utfall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Hämta voteringsutfall från riksdagen.se
        env:
          SUPABASE_URL: https://fmwxftnistkoqazfwnuj.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node agents/riksdag-utfall.js
          if [ $? -ne 0 ]; then
            echo "Riksdag-utfall misslyckades"
            exit 1
          fi
