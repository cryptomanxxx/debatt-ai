name: Handelsimperium — Daglig agenthandel

on:
  schedule:
    - cron: "0 21 * * *"  # 23:00 svensk tid (21:00 UTC)
  workflow_dispatch:

jobs:
  handel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Kör agenthandel
        env:
          SUPABASE_URL: https://fmwxftnistkoqazfwnuj.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python handel_test.py
