name: Parti-ekonomi (stipendium, valkampanj, motioner)

on:
  schedule:
    - cron: "0 13 * * *"   # 15:00 svensk tid (13:00 UTC)
  workflow_dispatch:

jobs:
  parti-ekonomi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installera beroenden
        run: pip install httpx

      - name: Kör parti-ekonomi
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u parti_ekonomi_test.py
