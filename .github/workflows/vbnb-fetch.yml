name: VBNB ETF Daglig Data

on:
  schedule:
    # Varje vardag 22:30 UTC (00:30 svensk tid) — efter USA-börsens stängning
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Anropa Vercel-endpoint för VanEck-data
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          echo "Anropar /api/admin/vbnb-fetch via Vercel..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST https://www.debatt-ai.se/api/admin/vbnb-fetch \
            -H "Authorization: Bearer $ADMIN_PASSWORD" \
            -H "Content-Type: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")

          echo "HTTP Status: $HTTP_STATUS"
          echo "Svar: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "FEL: Endpoint returnerade $HTTP_STATUS"
            exit 1
          fi
