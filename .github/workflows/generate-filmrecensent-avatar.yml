name: Generera Filmrecensent-avatar (engångskörning)

on:
  workflow_dispatch:
  # workflow_dispatch kräver att filen redan ligger på default-branchen för att
  # bli anropsbar via API/UI — den gör den inte förrän PR:en mergats. En
  # push-trigger scopad till just den här branchen låter oss köra workflowen
  # direkt utan att behöva merga till main först. Committen som pushar
  # resultatet märks [skip ci] för att inte trigga sig själv i en loop.
  push:
    branches:
      - claude/hmac-auth-vulnerability-e7ed2m
    paths:
      - '.github/workflows/generate-filmrecensent-avatar.yml'
      - 'scripts/generate-filmrecensent-avatar.js'

permissions:
  contents: write

jobs:
  generera:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Generera avatar via Pollinations
        run: node scripts/generate-filmrecensent-avatar.js

      - name: Committa avataren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/avatarer/filmrecensenten.png
          if git diff --cached --quiet; then
            echo "Ingen ändring att committa."
            exit 0
          fi
          git commit -m "Lägg till AI-genererad avatar för Filmrecensenten [skip ci]"
          git push
