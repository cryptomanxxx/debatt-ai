name: AI-bilder test

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent att testa (lämna tomt för slumpmässig)"
        required: false
        default: ""

jobs:
  bild-test:
    runs-on: ubuntu-latest
    permissions:
      models: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installera beroenden
        run: pip install httpx
      - name: Testa bildgenerering + Storage-uppladdning
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "${{ github.event.inputs.agent }}" ]; then
            python -u bild_test.py --agent "${{ github.event.inputs.agent }}"
          else
            python -u bild_test.py
          fi
