name: Engångsmigrering – podd-avatarer till Storage

# Temporär, manuellt triggad engångsmigrering (se scripts/upload-podd-assets.js).
# Tas bort ur repot i samma PR när migreringen är verifierad — inte tänkt att
# köras mer än en gång.
on:
  workflow_dispatch:

jobs:
  upload-podd-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Ladda upp podd-avatarer till Supabase Storage
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/upload-podd-assets.js

      - name: Verifiera publik åtkomst (körs bara manuellt, engångskontroll)
        run: |
          BASE="https://fmwxftnistkoqazfwnuj.supabase.co/storage/v1/object/public/podd-avatarer"
          for f in anna.png oraklet-m2-half.png nationalekonom.png teknikoptimist.png; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/$f")
            echo "$f -> HTTP $code"
            if [ "$code" != "200" ]; then echo "FEL: $f inte publikt nåbar"; exit 1; fi
          done
          echo "Alla stickprov publikt nåbara ✓"
