name: Auto-fix Codex Review

on:
  pull_request_review:
    types: [submitted]

jobs:
  fix:
    # Kör bara för Codex-boten, inte vid godkännanden
    if: |
      contains(github.event.review.user.login, 'codex') &&
      github.event.review.state != 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Hämta review-kommentarer
        id: data
        uses: actions/github-script@v7
        with:
          script: |
            const review = context.payload.review;
            const pr     = context.payload.pull_request;

            let inline = [];
            try {
              const { data } = await github.rest.pulls.listCommentsForReview({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                pull_number: pr.number,
                review_id:   review.id,
              });
              inline = data;
            } catch (e) {
              console.log('Kunde inte hämta inline-kommentarer:', e.message);
            }

            const parts = [];
            if (review.body && review.body.trim())
              parts.push(`SAMMANFATTNING:\n${review.body.trim()}`);

            for (const c of inline) {
              const rad = c.line || c.original_line || '?';
              parts.push(`FIL: ${c.path} (rad ${rad}):\n${c.body.trim()}`);
            }

            if (parts.length === 0) {
              core.setOutput('has_comments', 'false');
              return;
            }

            core.setOutput('has_comments', 'true');
            core.setOutput('comments',  parts.join('\n\n---\n\n'));
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('branch',    pr.head.ref);

      - name: Avbryt om inga kommentarer
        if: steps.data.outputs.has_comments != 'true'
        run: echo "Inga kommentarer att åtgärda — avslutar." && exit 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g @anthropic-ai/claude-code@latest

      - name: Fixa med Claude Code
        if: steps.data.outputs.has_comments == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_COMMENTS:    ${{ steps.data.outputs.comments }}
          PR_NUMBER:         ${{ steps.data.outputs.pr_number }}
          BRANCH_NAME:       ${{ steps.data.outputs.branch }}
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name  "Claude"

          python3 << 'PYEOF'
          import os

          comments = os.environ['CODEX_COMMENTS']
          pr_num   = os.environ['PR_NUMBER']
          branch   = os.environ['BRANCH_NAME']

          prompt = f"""Codex (automatisk kodgranskare) har granskat PR #{pr_num} (branch: {branch}).

          Granskning:
          {comments}

          Uppgift:
          1. Läs varje kommentar och hitta de berörda filerna i repot.
          2. Om fixen är tydlig och avgränsad (null-check, jämförelseoperator, saknad catch-block,
             saknad felhantering) — fixa direkt i koden.
          3. Om fixen är oklar, stor eller kräver arkitekturell diskussion — skapa
             ai-bus/suggestions/YYYY-MM-DD-codex-pr{pr_num}.md med status: pending istället.
          4. Max 5 fixar per körning — kvalitet framför kvantitet.
          5. Gör INGA ändringar utöver vad Codex specifikt nämner."""

          with open('/tmp/codex-prompt.txt', 'w') as f:
              f.write(prompt)
          PYEOF

          claude --dangerously-skip-permissions -p "$(cat /tmp/codex-prompt.txt)"

      - name: Committa och pusha
        if: steps.data.outputs.has_comments == 'true'
        env:
          BRANCH_NAME: ${{ steps.data.outputs.branch }}
          PR_NUMBER:   ${{ steps.data.outputs.pr_number }}
        run: |
          # Exkludera workflow-filer — GITHUB_TOKEN saknar rättighet att pusha dit
          git reset HEAD .github/workflows/ 2>/dev/null || true
          git add -A
          git diff --staged --quiet && echo "Inga ändringar gjorda." && exit 0
          git commit -m "fix(auto): adresserar Codex-granskning på PR #${PR_NUMBER}"
          git push origin "${BRANCH_NAME}"
