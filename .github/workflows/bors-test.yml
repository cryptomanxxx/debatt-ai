name: Kryptoborsen

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"   # 08:30 svensk tid (sommartid UTC+2)
    - cron: "15 13 * * *"  # 15:15 svensk tid (sommartid UTC+2)

jobs:
  bors:
    runs-on: ubuntu-latest
    permissions:
      models: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera beroenden
        run: pip install httpx

      - name: Kör börsen
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u bors_test.py
