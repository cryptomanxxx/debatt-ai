name: Kryptoborsen

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"   # 07:30 svensk tid (sommartid UTC+2)
    - cron: "30 6 * * *"   # 08:30 svensk tid
    - cron: "30 7 * * *"   # 09:30 svensk tid
    - cron: "30 8 * * *"   # 10:30 svensk tid
    - cron: "30 9 * * *"   # 11:30 svensk tid
    - cron: "30 10 * * *"  # 12:30 svensk tid
    - cron: "30 11 * * *"  # 13:30 svensk tid
    - cron: "30 12 * * *"  # 14:30 svensk tid
    - cron: "30 13 * * *"  # 15:30 svensk tid
    - cron: "30 14 * * *"  # 16:30 svensk tid
    - cron: "30 15 * * *"  # 17:30 svensk tid
    - cron: "30 16 * * *"  # 18:30 svensk tid
    - cron: "30 17 * * *"  # 19:30 svensk tid
    - cron: "30 18 * * *"  # 20:30 svensk tid

jobs:
  bors:
    runs-on: ubuntu-latest
    permissions:
      models: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installera beroenden
        run: pip install httpx

      - name: Kör börsen
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GROQ_API_KEY_7: ${{ secrets.GROQ_API_KEY_7 }}
          GROQ_API_KEY_8: ${{ secrets.GROQ_API_KEY_8 }}
          GROQ_API_KEY_9: ${{ secrets.GROQ_API_KEY_9 }}
          GROQ_API_KEY_10: ${{ secrets.GROQ_API_KEY_10 }}
          PYTHONUNBUFFERED: "1"
        run: python -u bors_test.py

      - name: Kör agent-token ICO
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GROQ_API_KEY_7: ${{ secrets.GROQ_API_KEY_7 }}
          GROQ_API_KEY_8: ${{ secrets.GROQ_API_KEY_8 }}
          GROQ_API_KEY_9: ${{ secrets.GROQ_API_KEY_9 }}
          GROQ_API_KEY_10: ${{ secrets.GROQ_API_KEY_10 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u agent_token_test.py
