name: Debatt-agent

on:
  schedule:
    # Nyhetsartiklar, repliker och egna debattartiklar: EN trigger per typ
    # (inte längre 4 separata triggers/typ, se ✅128 i CLAUDE.md). "Kör
    # agent"-steget nedan loopar 4 publiceringspass internt inom samma
    # körning för dessa tre crons — output förblir 4 artiklar/typ/dag, men
    # beror inte längre på att GitHub Actions schemaläggare avfyrar 12
    # separata cron-triggers pålitligt (dokumenterat opålitlig: kan både
    # hoppa över OCH leverera extra triggers).
    #
    # ✅129: tiderna flyttade till 09:00/10:00/11:00 svensk tid (tätt packade,
    # istället för tidigare 07:00/15:00/19:00) — se motsvarande kommentar i
    # agent.py (_CRON_TILL_TIMME) för varför fönstren där smalnades av i
    # samma veva.
    - cron: "0 7 * * *"   # 09:00 svensk tid — nyhetsartiklar (4 pass)
    - cron: "0 8 * * *"   # 10:00 svensk tid — egna debattartiklar (4 pass)
    - cron: "0 9 * * *"   # 11:00 svensk tid — repliker (4 pass)
    # Catch-up: 23:30–23:50 svensk tid (21:30–21:50 UTC), tre försök — inget
    # eget fönster, men agent.py kollar dagens 4+4+4-kvot vid varje pass och
    # tvingar fram en artikel av vilken typ som helst som fortfarande ligger
    # under 4 (t.ex. om flera tidigare cron-pass missades eller inte gav en
    # publicerbar artikel). Varje pass läser kvoten på nytt, så tre pass kan
    # tillsammans täcka upp till tre missade artiklar samma dag (Codex P2,
    # PR #1273 — ett enda pass täckte bara ett underskott). No-op så fort
    # kvoten är fylld. Minuttalen (istället för :00) undviker medvetet
    # GitHubs kända köbildning kring hela timmar.
    - cron: "30 21 * * *"  # 23:30 svensk tid — catch-up 1/3
    - cron: "40 21 * * *"  # 23:40 svensk tid — catch-up 2/3
    - cron: "50 21 * * *"  # 23:50 svensk tid — catch-up 3/3
  workflow_dispatch:       # Kan också köras manuellt från GitHub — eller
    # automatiskt av invariant-checker.js (se ✅131) som ombudspublicering
    # när en dags 4+4+4-kvot fortfarande har en typ på 0 långt efter att
    # dess primära fönster borde ha kört (t.ex. dagens gav bara 2/4
    # nyhetsartiklar efter en kraftigt försenad cron).
    inputs:
      pass:
        description: "Antal publiceringspass (1-4). Lämna som 1 för en vanlig manuell testkörning — invariant-checkerns automatiska ombudspublicering skickar alltid 4 för att ge samma täckning som ett riktigt fönster."
        required: false
        default: "1"

# Serialiserar körningar istället för att låta dem köra parallellt — utan
# detta kan två överlappande triggers (t.ex. en kraftigt försenad cron plus
# en ny) båda läsa samma dagskvot innan någon hinner publicera, och
# tillsammans skjuta en typ över 4 (Codex P2, PR #1272). cancel-in-progress
# är false eftersom en redan påbörjad körning ska tillåtas slutföra sin
# publicering, inte avbrytas mitt i.
#
# queue: max krävs utöver cancel-in-progress: false — utan den behåller
# GitHub bara EN väntande körning per grupp och ersätter tyst den gamla när
# en tredje trigger anländer (dokumenterat GitHub-beteende, se
# github.blog/changelog/2026-05-07). Utan queue: max hade konkurrensgruppen
# alltså kunnat tappa hela publiceringspass i stället för att bara förhindra
# överskjuten kvot (Codex P2, PR #1275).
concurrency:
  group: debatt-agent-publish
  cancel-in-progress: false
  queue: max

jobs:
  publicera:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read
      actions: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installera beroenden
        run: pip install anthropic httpx youtube-transcript-api

      # Hämtar körningens faktiska skapelsetidpunkt (när triggern verkligen
      # avfyrades) via GitHub API, inte väggklockan vid jobbstart. Behövs för
      # att agent.py ska kunna avgöra om en försenad cron-trigger är stale
      # över en midnattsgräns — timjämförelse ensam räcker inte om
      # förseningen är så stor att den nya timmen råkar vara >= cron-timmen
      # (Codex P2, PR #1280). Faller tyst tillbaka till tom sträng vid fel —
      # agent.py har en timbaserad reservlösning.
      - name: Hämta körningens skapelsetid
        id: run_meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CREATED_AT=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .created_at 2>/dev/null || echo "")
          echo "created_at=$CREATED_AT" >> "$GITHUB_OUTPUT"

      - name: Kör agent
        env:
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GROQ_API_KEY_7: ${{ secrets.GROQ_API_KEY_7 }}
          GROQ_API_KEY_8: ${{ secrets.GROQ_API_KEY_8 }}
          GROQ_API_KEY_9: ${{ secrets.GROQ_API_KEY_9 }}
          GROQ_API_KEY_10: ${{ secrets.GROQ_API_KEY_10 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBATT_API_KEY: ${{ secrets.DEBATT_API_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_PROXY_SECRET: ${{ secrets.YOUTUBE_PROXY_SECRET }}
          PYTHONUNBUFFERED: "1"
          # Exakt cron-uttryck som triggade körningen (tomt vid workflow_dispatch).
          # agent.py använder detta istället för väggklockans UTC-timme för att
          # avgöra vilket publiceringsfönster som gäller — annars kan en kraftigt
          # försenad trigger (t.ex. en catch-up-cron köad bakom concurrency-
          # gruppen) hamna i fel eller inget fönster alls (Codex P2, PR #1277).
          AGENT_CRON: ${{ github.event.schedule }}
          # Triggerns faktiska avfyrningstidpunkt (ISO 8601, UTC) — används för
          # att avgöra om AGENT_CRON är stale över en midnattsgräns (se steget
          # "Hämta körningens skapelsetid" ovan). Tom sträng om API-anropet
          # misslyckades.
          AGENT_RUN_CREATED_AT: ${{ steps.run_meta.outputs.created_at }}
          # Antal pass begärt via workflow_dispatch (tom sträng vid en
          # schemalagd körning, se ✅131). Bara relevant i case-satsens
          # fallback-gren nedan — de tre primära crons ignorerar den helt.
          AGENT_DISPATCH_PASS: ${{ github.event.inputs.pass }}
        run: |
          # De tre primära fönster-crons (nyhet/replik/eget) loopar alltid 4
          # publiceringspass i samma körning — se ✅128 i CLAUDE.md. Catch-up-
          # crons förblir 1 pass: att loopa catch-up 4x hade fyrdubblat dess
          # kompensationskapacitet (från max 3 till max 12 återhämtade
          # artiklar/dag) och underminerat själva poängen med att ha tre
          # separata, oberoende catch-up-tillfällen.
          #
          # workflow_dispatch (manuell ELLER invariant-checkerns automatiska
          # ombudspublicering, ✅131) läser istället AGENT_DISPATCH_PASS —
          # default 1 för en vanlig manuell testkörning, men invariant-
          # checkern skickar alltid 4 för att en ombudspublicering ska ha
          # samma chans att täcka ett flertypsunderskott som ett riktigt
          # fönster. Klampad till [1,4] mot en tom/felaktig/orimlig indata
          # (t.ex. någon som råkar skriva "999" i GitHub-UI:t) — aldrig fler
          # pass än ett riktigt fönster redan kör.
          case "$AGENT_CRON" in
            "0 7 * * *"|"0 8 * * *"|"0 9 * * *")
              PASS=4
              ;;
            *)
              PASS="${AGENT_DISPATCH_PASS:-1}"
              case "$PASS" in
                ''|*[!0-9]*) PASS=1 ;;
              esac
              if [ "$PASS" -lt 1 ]; then PASS=1; fi
              if [ "$PASS" -gt 4 ]; then PASS=4; fi
              ;;
          esac
          # set +e: ett misslyckat pass ska inte hindra resten av passen i
          # samma fönster från att försöka — annars hade en enda krasch i
          # pass 1 tyst tystat pass 2–4 (bash -eo pipefail är GitHub Actions
          # default för run:-block).
          set +e
          FAILED=0
          for i in $(seq 1 "$PASS"); do
            echo "=== Publiceringspass $i/$PASS (AGENT_CRON='$AGENT_CRON') ==="
            python -u agent.py
            ec=$?
            if [ $ec -ne 0 ]; then
              echo "::warning::Pass $i/$PASS misslyckades (exit $ec) — fortsätter med nästa pass."
              FAILED=1
            fi
            if [ "$i" -lt "$PASS" ]; then
              sleep 60
            fi
          done
          exit $FAILED
