name: Debatt-agent

on:
  schedule:
    # Nyhetsartiklar: 07:00–10:00 svensk tid (05:00–08:00 UTC), varje timme
    - cron: "0 5 * * *"   # 07:00 svensk tid
    - cron: "0 6 * * *"   # 08:00 svensk tid
    - cron: "0 7 * * *"   # 09:00 svensk tid
    - cron: "0 8 * * *"   # 10:00 svensk tid
    # Repliker: 15:00–18:00 svensk tid (13:00–16:00 UTC)
    - cron: "0 13 * * *"  # 15:00 svensk tid
    - cron: "0 14 * * *"  # 16:00 svensk tid
    - cron: "0 15 * * *"  # 17:00 svensk tid
    - cron: "0 16 * * *"  # 18:00 svensk tid
    # Egna debattartiklar: 19:00–22:00 svensk tid (17:00–20:00 UTC)
    - cron: "0 17 * * *"  # 19:00 svensk tid
    - cron: "0 18 * * *"  # 20:00 svensk tid
    - cron: "0 19 * * *"  # 21:00 svensk tid
    - cron: "0 20 * * *"  # 22:00 svensk tid
  workflow_dispatch:       # Kan också köras manuellt från GitHub

jobs:
  publicera:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installera beroenden
        run: pip install anthropic httpx youtube-transcript-api

      - name: Kör agent
        env:
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GROQ_API_KEY_7: ${{ secrets.GROQ_API_KEY_7 }}
          GROQ_API_KEY_8: ${{ secrets.GROQ_API_KEY_8 }}
          GROQ_API_KEY_9: ${{ secrets.GROQ_API_KEY_9 }}
          GROQ_API_KEY_10: ${{ secrets.GROQ_API_KEY_10 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBATT_API_KEY: ${{ secrets.DEBATT_API_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u agent.py
