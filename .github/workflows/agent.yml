name: Debatt-agent

on:
  schedule:
    # Nyhetsartiklar: 07:00–10:00 svensk tid (05:00–08:00 UTC), varje timme
    - cron: "0 5 * * *"   # 07:00 svensk tid
    - cron: "0 6 * * *"   # 08:00 svensk tid
    - cron: "0 7 * * *"   # 09:00 svensk tid
    - cron: "0 8 * * *"   # 10:00 svensk tid
    # Repliker: 15:00–18:00 svensk tid (13:00–16:00 UTC)
    - cron: "0 13 * * *"  # 15:00 svensk tid
    - cron: "0 14 * * *"  # 16:00 svensk tid
    - cron: "0 15 * * *"  # 17:00 svensk tid
    - cron: "0 16 * * *"  # 18:00 svensk tid
    # Egna debattartiklar: 19:00–22:00 svensk tid (17:00–20:00 UTC)
    - cron: "0 17 * * *"  # 19:00 svensk tid
    - cron: "0 18 * * *"  # 20:00 svensk tid
    - cron: "0 19 * * *"  # 21:00 svensk tid
    - cron: "0 20 * * *"  # 22:00 svensk tid
    # Catch-up: 23:30 svensk tid (21:30 UTC) — inget eget fönster, men agent.py
    # kollar dagens 4+4+4-kvot och tvingar fram en artikel av vilken typ som
    # helst som fortfarande ligger under 4 (t.ex. om ett tidigare cron-pass
    # missades eller inte gav en publicerbar artikel). No-op om kvoten redan
    # är fylld. Minuttalet 30 (istället för :00) undviker medvetet GitHubs
    # kända köbildning kring hela timmar.
    - cron: "30 21 * * *"  # 23:30 svensk tid — catch-up
  workflow_dispatch:       # Kan också köras manuellt från GitHub

# Serialiserar körningar istället för att låta dem köra parallellt — utan
# detta kan två överlappande triggers (t.ex. en kraftigt försenad cron plus
# en ny) båda läsa samma dagskvot innan någon hinner publicera, och
# tillsammans skjuta en typ över 4 (Codex P2, PR #1272). cancel-in-progress
# är false eftersom en redan påbörjad körning ska tillåtas slutföra sin
# publicering, inte avbrytas mitt i.
#
# queue: max krävs utöver cancel-in-progress: false — utan den behåller
# GitHub bara EN väntande körning per grupp och ersätter tyst den gamla när
# en tredje trigger anländer (dokumenterat GitHub-beteende, se
# github.blog/changelog/2026-05-07). Utan queue: max hade konkurrensgruppen
# alltså kunnat tappa hela publiceringspass i stället för att bara förhindra
# överskjuten kvot (Codex P2, PR #1275).
concurrency:
  group: debatt-agent-publish
  cancel-in-progress: false
  queue: max

jobs:
  publicera:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installera beroenden
        run: pip install anthropic httpx youtube-transcript-api

      - name: Kör agent
        env:
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GROQ_API_KEY_7: ${{ secrets.GROQ_API_KEY_7 }}
          GROQ_API_KEY_8: ${{ secrets.GROQ_API_KEY_8 }}
          GROQ_API_KEY_9: ${{ secrets.GROQ_API_KEY_9 }}
          GROQ_API_KEY_10: ${{ secrets.GROQ_API_KEY_10 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBATT_API_KEY: ${{ secrets.DEBATT_API_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u agent.py
