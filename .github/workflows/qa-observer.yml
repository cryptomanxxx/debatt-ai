name: Visuell QA-observatör

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL att testa (default: https://www.debatt-ai.se)"
        required: false
        default: "https://www.debatt-ai.se"
  schedule:
    # Kör varje måndag 10:00 svensk tid (08:00 UTC)
    - cron: "0 8 * * 1"

jobs:
  qa-observer:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checka ut koden
        uses: actions/checkout@v7

      - name: Installera Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Installera beroenden
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Kör QA-observatören
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GROQ_API_KEY_7: ${{ secrets.GROQ_API_KEY_7 }}
          GROQ_API_KEY_8: ${{ secrets.GROQ_API_KEY_8 }}
          GROQ_API_KEY_9: ${{ secrets.GROQ_API_KEY_9 }}
          GROQ_API_KEY_10: ${{ secrets.GROQ_API_KEY_10 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BASE_URL: ${{ github.event.inputs.base_url || 'https://www.debatt-ai.se' }}
        run: node agents/qa-observer.js

      - name: Commit QA-rapport
        if: always()
        run: |
          git config user.name "QA Observer"
          git config user.email "noreply@debatt-ai.se"
          git add ai-bus/discussions/
          git diff --cached --quiet || git commit -m "qa: Veckovis QA-rapport $(date +%Y-%m-%d)"
          git push
