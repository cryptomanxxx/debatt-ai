name: Automatisk nyhetsanalys

on:
  schedule:
    # Var 20:e minut i teorin — men GitHub Actions levererar scheman tätare
    # än ~1 gång/timme som "best effort" och droppar i praktiken merparten
    # (verifierat: 9 faktiska körningar på 31 timmar istället för ~90).
    # Behålls som catch-up-bonus, men workflow_run nedan är den pålitliga
    # vägen in nu.
    - cron: "*/20 * * * *"
  workflow_run:
    # Kör direkt efter varje Nyhetsflöde-körning (6 ggr/dag, cron ≥1h — den
    # kadensen levererar GitHub tillförlitligt). Garanterar täckning istället
    # för att förlita sig på ett 20-minuters schema som sällan faktiskt kör.
    workflows: ["Nyhetsflöde"]
    types: [completed]
  workflow_dispatch:

# Codex-fynd (PR #1318): utan detta kan en workflow_run-triggad körning och
# en samtidig */20-schema-tick (eller manuell dispatch) båda läsa samma
# "saknar analys"-rader innan endera hinner skriva — nyhetsanalys saknar en
# UNIQUE-constraint på nyhet_id, så resultatet blir dubbla AI-reaktioner på
# samma nyhet och bortkastad providerbudget. Samma mönster som agent.yml
# använder för att serialisera sina egna överlappande triggers.
concurrency:
  group: nyhetsanalys-auto
  cancel-in-progress: false
  queue: max

jobs:
  nyhetsanalys-auto:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installera beroenden
        run: pip install httpx

      - name: Kör nyhetsanalys_auto_test.py
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u nyhetsanalys_auto_test.py
